services:
  bootlens-community:
    build:
      context: ./BootLens.Community.Api
    ports:
      - "127.0.0.1:${BOOTLENS_COMMUNITY_PORT:-8080}:8080"
    environment:
      BOOTLENS_DB_PATH: /data/community.db
    volumes:
      - bootlens-community-data:/data
    restart: unless-stopped
volumes:
  bootlens-community-data:
