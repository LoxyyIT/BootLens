name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BootLens.sln
      - run: dotnet build BootLens.sln -c Release --no-restore
      - run: dotnet test BootLens.sln -c Release --no-build --no-restore
      - shell: pwsh
        run: ./scripts/validate-localization.ps1
